databases:
  - name: georetail-db
    databaseName: georetail
    user: georetail
    plan: free
    ipAllowList: []   # allow connections from Render services

services:
  - type: web
    name: georetail-guatemala
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: georetail-db
          property: connectionString
      - key: VITE_API_URL
        value: ""
